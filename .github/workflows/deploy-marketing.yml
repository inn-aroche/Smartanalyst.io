name: Deploy marketing site

# Deploys apps/marketing/ to Hostinger Cloud via rsync over SSH.
# Triggers on push to main, only when marketing files or shared deps change.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   HOSTINGER_SSH_HOST          e.g. 145.223.xxx.xxx (or your SSH hostname)
#   HOSTINGER_SSH_PORT          Hostinger default is 65002 (not 22)
#   HOSTINGER_SSH_USER          your Hostinger SSH username (e.g. u123456789)
#   HOSTINGER_SSH_PRIVATE_KEY   PEM contents of the private key authorized on the server
#   HOSTINGER_DEPLOY_PATH       absolute path on server, e.g. /home/u123456789/domains/smartanalyst.io/public_html
#
# See docs/DEPLOYMENT.md for the one-time setup procedure.

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'apps/tag/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-marketing
      url: https://smartanalyst.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build SmartTag bundle (apps/tag)
        # Le tag /sa.js est servi par le subdomain marketing à
        # https://smartanalyst.io/sa.js. On build le bundle minifié IIFE
        # puis on le pousse dans apps/marketing/public/ pour qu'Astro
        # l'inclue tel quel dans dist/ au build suivant.
        run: |
          npm run build --workspace=@smartanalyst/tag
          mkdir -p apps/marketing/public
          cp apps/tag/dist/sa.js apps/marketing/public/sa.js
          echo "▸ sa.js copied into marketing public/ ($(wc -c < apps/marketing/public/sa.js) bytes)"

      - name: Build marketing site
        run: npm run build --workspace=@smartanalyst/marketing

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Trust Hostinger host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync (atomic, two-pass)
        # Two-pass deploy to keep the live site responsive throughout the upload:
        #   Pass 1 — non-HTML files (assets in _astro/, images, etc.) WITHOUT --delete.
        #     Old hashed assets stay alongside the new ones so any user mid-navigation
        #     still gets their assets. No 404 race.
        #   Pass 2 — HTML files only. rsync uploads each file to a temp name then
        #     renames it (POSIX atomic), so the index file is never absent → no 403.
        # We deliberately drop --delete: orphaned hashed assets accumulate slowly
        # and are cleaned up manually if needed. The 'mirror' workflow_dispatch
        # below exists for full-sync runs when a page is removed.
        #
        # --chmod=D755,F644 forces sane Apache permissions; without this, rsync
        # occasionally produces 600/700 perms that trip a 403.
        run: |
          set -euo pipefail
          SSH_OPTS="ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}"
          REMOTE="${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/"

          echo "▸ Pass 1: non-HTML assets + .htaccess (additive, no delete)"
          rsync -avz \
            --exclude='*.html' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --chmod=D755,F644 \
            -e "$SSH_OPTS" \
            apps/marketing/dist/ "$REMOTE"

          echo "▸ Pass 2: HTML files (atomic swap per file)"
          rsync -avz \
            --include='*/' --include='*.html' --exclude='*' \
            --prune-empty-dirs \
            --chmod=D755,F644 \
            -e "$SSH_OPTS" \
            apps/marketing/dist/ "$REMOTE"

      - name: Verify deploy (health check)
        # Hits the public URL after the upload to confirm Apache is serving the
        # new build — catches three classes of silent failure that previously
        # let "green deploy + dead site" slip through:
        #   1. HOSTINGER_DEPLOY_PATH pointing somewhere other than the active
        #      document root (rsync succeeds, but Apache never sees the files).
        #   2. Orphan files in public_html/ (no --delete) shadowing index.html.
        #   3. Domain detached from the hosting plan (Hostinger serves a default
        #      403/404 instead of our pages).
        # Status 200 alone isn't enough — a Hostinger "site parked" page also
        # returns 200, so we also require the body to contain a build marker.
        run: |
          set -euo pipefail
          # Small grace period: rsync's atomic rename can lag a few seconds
          # behind on Hostinger's shared filesystem.
          sleep 10
          check() {
            local url=$1
            for attempt in 1 2 3; do
              echo "▸ [$attempt/3] GET $url"
              status=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 15 "$url" || echo "000")
              if [ "$status" = "200" ] && grep -qi 'smartanalyst' /tmp/body; then
                echo "  ✓ 200 OK + body marker present"
                return 0
              fi
              echo "  ✗ status=$status, marker=$(grep -qi smartanalyst /tmp/body && echo found || echo missing)"
              [ "$attempt" -lt 3 ] && sleep 10
            done
            echo "::error::Health check failed for $url after 3 attempts"
            return 1
          }
          check "https://smartanalyst.io/"
          check "https://smartanalyst.io/en/"

          # Sanity check du bundle SmartTag : il doit être servi sous /sa.js
          # avec un content-type JS et un body non vide.
          echo "▸ GET https://smartanalyst.io/sa.js"
          tag_status=$(curl -sS -o /tmp/sa -w '%{http_code}' --max-time 15 "https://smartanalyst.io/sa.js" || echo "000")
          tag_size=$(wc -c < /tmp/sa 2>/dev/null || echo 0)
          if [ "$tag_status" != "200" ] || [ "$tag_size" -lt 500 ]; then
            echo "::error::sa.js health check failed (status=$tag_status, size=$tag_size)"
            exit 1
          fi
          echo "  ✓ sa.js served ($tag_size bytes)"

          echo "All health checks passed."

      - name: Summary
        run: |
          echo "### Marketing deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://smartanalyst.io" >> $GITHUB_STEP_SUMMARY
