name: DB migrations

# Applique les migrations Supabase de manière contrôlée :
#   - PR qui touche supabase/migrations/** → lint (naming + syntaxe basique)
#   - Push main qui touche supabase/migrations/** → lint + supabase db push
#
# La logique apply-only-on-main évite qu'une PR en review modifie la DB de prod.
# Le `concurrency` empêche 2 deploys parallèles (race entre 2 merges quasi-simultanés).
#
# Pré-requis (setup une fois — voir docs/05c_DB_MIGRATIONS_CI.md) :
#   - Secret GitHub SUPABASE_ACCESS_TOKEN (PAT créé sur supabase.com/dashboard/account/tokens)
#   - Secret GitHub SUPABASE_PROJECT_REF (visible dans l'URL Supabase, ex: abcdefghijklmnop)
#   - Secret GitHub SUPABASE_DB_PASSWORD (mot de passe du user postgres, dashboard → DB settings)
#
# Sans ces 3 secrets, le job `apply` skip avec un message clair (pas d'échec dur).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/lint-migrations.sh'
      - '.github/workflows/db-migrations.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/lint-migrations.sh'
      - '.github/workflows/db-migrations.yml'
  workflow_dispatch:

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint migration files
        run: bash scripts/lint-migrations.sh

      - name: Summary
        if: always()
        run: |
          echo "### Migration lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Files: \`$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Latest: \`$(ls -1 supabase/migrations/*.sql 2>/dev/null | sort | tail -1 | xargs -n1 basename)\`" >> $GITHUB_STEP_SUMMARY

  apply:
    # TEMPORAIRE — skip auto-apply tant que l'historique de migrations distant
    # n'est pas aligné avec les fichiers locaux.
    #
    # Contexte du drift
    # -----------------
    # Avant la mise en place de ce workflow (PR #43), les migrations 001-016
    # étaient appliquées manuellement via le SQL Editor du dashboard Supabase.
    # Chaque apply manuel crée une entrée dans `supabase_migrations.schema_migrations`
    # avec un timestamp YYYYMMDDHHMMSS (ex: 20260528151015) — pas avec le nom
    # du fichier local (ex: 001_init_base_schema.sql).
    #
    # Résultat : le CLI Supabase voit 17 versions distantes (timestamps) qui ne
    # correspondent à aucun fichier local (NNN_*.sql) → `supabase db push` plante
    # avec "Remote migration versions not found in local migrations directory".
    #
    # Comment résoudre (one-shot, ~10 min)
    # ------------------------------------
    # Depuis ton Mac (avec Supabase CLI installé + linked au projet) :
    #
    #   supabase migration repair --status applied \\
    #     20260528151015 20260528151032 20260528151052 20260528151105 \\
    #     20260528151121 20260528151131 20260528151141 20260528151207 \\
    #     20260528151222 20260528151232 20260530105834 20260530105850 \\
    #     20260530144305 20260531135123 20260531165340 20260531204640 \\
    #     20260531205056
    #
    #   # Vérifier
    #   supabase migration list --linked
    #   # → "Local | Remote | Time" avec tous les distants en "applied"
    #
    # Une fois aligné, remettre la condition à :
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # et l'apply auto reprendra pour les nouvelles migrations.
    #
    # Voir aussi docs/05c_DB_MIGRATIONS_CI.md section "Drift entre le code et la DB".
    #
    # Tant que c'est pas réglé : appliquer les nouvelles migrations
    # manuellement via le SQL Editor du dashboard Supabase.
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Fail-fast clair plutôt que des erreurs cryptiques de la CLI Supabase.
        # Le `: "${VAR:?msg}"` throw avec message custom si VAR vide.
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret manquant — voir docs/05c_DB_MIGRATIONS_CI.md}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF secret manquant — voir docs/05c_DB_MIGRATIONS_CI.md}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD secret manquant — voir docs/05c_DB_MIGRATIONS_CI.md}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: List unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Affiche les migrations en attente AVANT le push. Si la sortie est
        # vide → tout est déjà appliqué, le push est un no-op (pas d'erreur).
        run: |
          echo "▸ Migrations status before push:"
          supabase migration list --linked 2>&1 | tail -50 || true

      - name: Push migrations to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --include-all pour ne pas être interactif. Le CLI échoue
        # explicitement si une migration n'est plus appliquable (renaming,
        # etc.) — on veut ce signal en CI.
        run: |
          echo "▸ Pushing migrations to project ${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify post-push state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "▸ Migrations status after push:"
          supabase migration list --linked 2>&1 | tail -10 || true

      - name: Summary
        if: always()
        run: |
          echo "### Supabase migrations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`${{ secrets.SUPABASE_PROJECT_REF }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
