name: Deploy API to VPS

# Déclenche le webhook deploy-server sur le VPS au lieu de SSH+rsync.
# Avantages : pas de port 22 dans la CI → plus de risque de blocage SSH /
# Anti-DDoS Hostinger / fail2ban. Le VPS pull lui-même depuis GitHub via
# sa deploy key SSH, puis pm2 reload.
#
# Pré-requis (setup une fois côté VPS — voir docs/05b_VPS_DEPLOY_SERVER.md) :
#   1. Cloner le repo dans /srv/smartanalyst-repo (deploy key SSH lecture-only).
#   2. PM2 process "deploy-server" qui écoute sur 127.0.0.1:3001.
#   3. Nginx proxy /admin/deploy/* → 127.0.0.1:3001/deploy/*.
#   4. Secret GitHub DEPLOY_TOKEN = même valeur que la var DEPLOY_TOKEN
#      du deploy-server VPS.
#
# Required GitHub secrets:
#   DEPLOY_TOKEN   token long (≥ 32 chars) authentifiant le call webhook.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy-api.sh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://api.smartanalyst.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (full, for tests)
        run: npm ci

      - name: Run API tests
        run: npm run test --workspace=@smartanalyst/api

      - name: Trigger deploy webhook on VPS
        # Le serveur lance scripts/deploy-api.sh côté VPS : git pull origin/main,
        # rsync vers /srv/smartanalyst-api, npm ci --omit=dev, pm2 reload.
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_TOKEN:?DEPLOY_TOKEN secret is empty or unset}"

          echo "▸ POST https://api.smartanalyst.io/admin/deploy/api"
          response=$(curl -sS -w '\n%{http_code}' \
            -X POST https://api.smartanalyst.io/admin/deploy/api \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 480 \
            -d '{}')

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $http_code"
          # On tronque la sortie : utile pour debug si échec, pas pour parsing.
          echo "$body" | jq -r '.stdout // empty' 2>/dev/null | tail -50 || true

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Deploy webhook failed (HTTP $http_code)"
            echo "$body" | head -100
            exit 1
          fi
          echo "▸ Deploy webhook OK"

      - name: Verify deploy (health check + Helmet header sanity)
        # On vérifie 2 choses : l'API répond 200 ET un header Helmet est posé.
        # Si Helmet manque, c'est que pm2 sert encore l'ancienne version.
        run: |
          set -euo pipefail
          sleep 5
          for attempt in 1 2 3 4 5; do
            echo "▸ [$attempt/5] curl -I https://api.smartanalyst.io/health"
            headers=$(curl -sSI --max-time 10 https://api.smartanalyst.io/health || true)
            status=$(echo "$headers" | head -1 || echo "")
            has_helmet=$(echo "$headers" | grep -i 'strict-transport-security' || true)
            if echo "$status" | grep -qE '200|HTTP/[12] 200'; then
              if [ -n "$has_helmet" ]; then
                echo "  ✓ 200 OK + Helmet active"
                exit 0
              fi
              echo "  ⚠ 200 OK mais pas de header Helmet (cache navigateur ? pm2 pas reload ?)"
            fi
            [ "$attempt" -lt 5 ] && sleep 6
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Summary
        run: |
          echo "### API deployed via webhook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://api.smartanalyst.io" >> $GITHUB_STEP_SUMMARY
          echo "- Methode: POST /admin/deploy/api (pas de SSH)" >> $GITHUB_STEP_SUMMARY
