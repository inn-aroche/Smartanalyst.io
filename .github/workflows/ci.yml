name: CI

# Runs quality gates on every PR and on pushes to main.
# Keeps deploy decisions separate (see deploy-marketing.yml).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        # Informative-only for now. `format:check` respecte .prettierignore
        # (qui exclut les .astro faute de prettier-plugin-astro). Reste à
        # reformater la baseline existante (`npm run format`) avant de retirer
        # continue-on-error et de rendre ce gate bloquant.
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        # NOTE: apps/api defines `lint` (eslint v9) but no eslint.config.js exists yet.
        # Informative-only until that config lands; then remove `continue-on-error`.
        continue-on-error: true
        run: npm run lint --workspaces --if-present

      - name: Tests
        run: npm run test --workspaces --if-present

      - name: Web build (smoke)
        # Build le SaaS React : `tsc -b && vite build`. Catch les erreurs
        # TypeScript et les imports cassés AVANT le merge — important vu le
        # volume de travail frontend (Home, reset password, Settings, etc.).
        run: npm run build --workspace=@smartanalyst/web

      - name: Marketing build (smoke)
        # Catches Astro template / shared-package breakage before deploy.
        run: npm run build --workspace=@smartanalyst/marketing
