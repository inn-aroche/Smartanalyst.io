<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06060B"/>
      <stop offset="1" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d82ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#3d82ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3d82ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <!-- Logo mark + wordmark -->
  <g transform="translate(80,80)">
    <rect width="56" height="56" rx="14" fill="url(#brand)"/>
    <text x="80" y="40" font-family="Syne, DM Sans, system-ui, sans-serif" font-size="32" font-weight="700" fill="#ECECEA">SmartAnalyst</text>
  </g>

  <!-- Hero copy -->
  <text x="80" y="280" font-family="Syne, DM Sans, system-ui, sans-serif" font-size="76" font-weight="700" fill="#ECECEA" letter-spacing="-2">
    Your marketing data,
  </text>
  <text x="80" y="370" font-family="Syne, DM Sans, system-ui, sans-serif" font-size="76" font-weight="700" fill="url(#brand)" letter-spacing="-2">
    finally understood.
  </text>

  <!-- Sub copy -->
  <text x="80" y="450" font-family="DM Sans, system-ui, sans-serif" font-size="26" fill="#A8A8B8">
    Ask any question about your marketing performance.
  </text>
  <text x="80" y="488" font-family="DM Sans, system-ui, sans-serif" font-size="26" fill="#A8A8B8">
    Get structured answers — causes, evidence, next steps.
  </text>

  <!-- Connectors pill row -->
  <g transform="translate(80,540)" font-family="Space Mono, monospace" font-size="18" fill="#A8A8B8">
    <g>
      <rect x="0" y="0" width="80" height="36" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="40" y="24" text-anchor="middle">GA4</text>
    </g>
    <g transform="translate(96,0)">
      <rect x="0" y="0" width="120" height="36" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="60" y="24" text-anchor="middle">Meta Ads</text>
    </g>
    <g transform="translate(232,0)">
      <rect x="0" y="0" width="140" height="36" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="70" y="24" text-anchor="middle">Google Ads</text>
    </g>
    <g transform="translate(388,0)">
      <rect x="0" y="0" width="90" height="36" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="45" y="24" text-anchor="middle">Stripe</text>
    </g>
    <g transform="translate(494,0)">
      <rect x="0" y="0" width="180" height="36" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="90" y="24" text-anchor="middle">Search Console</text>
    </g>
  </g>

  <!-- URL badge -->
  <g transform="translate(1000,540)">
    <text x="0" y="24" font-family="Space Mono, monospace" font-size="20" fill="#74748C">smartanalyst.io</text>
  </g>
</svg>
