<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>SmartAnalyst</title>

    <!-- Google Consent Mode v2 — default deny, must run BEFORE GTM.
         Le banner (composant React ConsentBanner) appellera gtag('consent','update', …)
         après le choix utilisateur. Lit le choix stocké pour pré-appliquer si dispo. -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        var stored = null;
        try {
          var raw = localStorage.getItem('sa-app-consent-v1');
          if (raw) {
            var c = JSON.parse(raw);
            var maxAge = 13 * 30 * 24 * 3600 * 1000;
            if (c && c.ts && Date.now() - new Date(c.ts).getTime() < maxAge) stored = c;
          }
        } catch (_) {}
        var analytics = stored ? !!stored.analytics : false;
        var ads = stored ? !!stored.ads : false;
        gtag('consent', 'default', {
          ad_storage: ads ? 'granted' : 'denied',
          ad_user_data: ads ? 'granted' : 'denied',
          ad_personalization: ads ? 'granted' : 'denied',
          analytics_storage: analytics ? 'granted' : 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500,
        });
      })();
    </script>
    <!-- End Consent Mode v2 default -->

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MCHTX3BG');</script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MCHTX3BG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
